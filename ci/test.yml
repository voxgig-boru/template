name: tests

# The template module is written in boru, so CI builds the `boru` binary from
# source before running anything. The CI *logic* lives in ci/ as scripts
# (ci/build-boru.sh, ci/run-tests.sh, ci/check-consistency.sh) plus
# test/divergence/run.sh — this workflow just invokes them, so the same steps
# run locally and in CI. The library tracks boru main (ci/boru-ref); there is
# no pinned commit.
#
# NOTE: ci/test.yml is the canonical copy. .github/workflows/test.yml is a
# promoted copy (pushing to .github/workflows/ needs `workflow` token scope);
# the two differ only in comments and step names — see ci/README.md.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out template
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      # Track boru-lang/boru main: resolve its current HEAD once, reuse across
      # jobs. A new HEAD yields a new cache key and forces a rebuild.
      - name: Resolve boru main HEAD
        id: ref
        run: echo "aql_ref=$(git ls-remote https://github.com/boru-lang/boru.git main | cut -f1)" >> "$GITHUB_OUTPUT"

      # The compiled binary only depends on the ref (and the OS), so a cache
      # hit lets ci/build-boru.sh skip the fetch + build entirely.
      - name: Cache boru binary
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/boru
          key: boru-${{ steps.ref.outputs.aql_ref }}-${{ runner.os }}

      # Builds boru at main HEAD (cache miss only), runs every suite (each must
      # exit 0 and print `all green` where it asserts), then `boru check
      # template.aql` (must report 0 errors).
      - name: Build boru and run the suites
        env:
          BORU_REF: ${{ steps.ref.outputs.aql_ref }}
        run: ci/run-tests.sh

  # Single-path gate: every suite must compile and run green under `boru X`
  # (the only execution path on boru main) AND report 0 errors under
  # `boru check X`; the module must check clean. run.sh builds its own boru at
  # main HEAD (codeload tarball) and is self-contained. See
  # test/divergence/README.md.
  divergence:
    runs-on: ubuntu-latest
    steps:
      - name: Check out template
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: run (compiled) + check gate
        run: test/divergence/run.sh

  # Packaging guard (no boru needed): the plugin must bundle its own copy of
  # the skill, the JSON manifests must parse, and no script may invoke a
  # retired boru flag (--compile / --force-compile / --no-compile).
  consistency:
    runs-on: ubuntu-latest
    steps:
      - name: Check out template
        uses: actions/checkout@v4

      - name: Skill drift, JSON manifests, retired flags
        run: ci/check-consistency.sh
